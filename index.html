<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เว็บเช็กชื่อ - Modern Attendance</title>
<!-- Google Fonts (Kanit)[cite: 1] -->
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- FontAwesome Icons[cite: 1] -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#f8fafc;--card:#ffffff;--pri:#6366f1;--pri-d:#4f46e5;--ok:#10b981;--absent:#ef4444;--leave:#f59e0b;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;--radius:16px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Kanit',sans-serif;background:var(--bg);color:var(--txt);line-height:1.6;}
header{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:32px 20px;text-align:center;box-shadow:0 10px 25px -5px rgba(99,102,241,.25);}
header h1{font-size:1.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;}
header p{opacity:.9;font-size:.95rem;margin-top:6px;font-weight:300;}

.wrap{max-width:920px;margin:0 auto;padding:24px 16px;}
.card{background:var(--card);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:0 4px 20px -2px rgba(0,0,0,.04);border:1px solid rgba(226,232,240,.8);}
.card h2{font-size:1.15rem;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-weight:600;color:#1e293b;}

.row{display:flex;gap:10px;flex-wrap:wrap;}
input,select{padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:.95rem;flex:1;min-width:140px;outline:none;font-family:inherit;transition:.2s;background:#fcfdff;}
input:focus,select:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(99,102,241,.12);background:#fff;}

button{cursor:pointer;padding:12px 20px;border:none;border-radius:12px;background:var(--pri);color:#fff;font-size:.95rem;font-weight:600;transition:.2s;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(99,102,241,.2);}
button:hover{background:var(--pri-d);transform:translateY(-1px);box-shadow:0 6px 16px rgba(99,102,241,.3);}
button:active{transform:translateY(0);}
button.ghost{background:#e0e7ff;color:var(--pri);box-shadow:none;}
button.ghost:hover{background:#c7d2fe;}
button.danger{background:#fee2e2;color:var(--absent);box-shadow:none;}
button.danger:hover{background:#fecaca;}
button.sm{padding:8px 14px;font-size:.85rem;border-radius:10px;}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.tab{padding:10px 18px;border-radius:12px;background:#f1f5f9;color:var(--mut);cursor:pointer;font-weight:600;font-size:.9rem;border:1.5px solid transparent;display:flex;align-items:center;gap:8px;transition:.2s;}
.tab:hover{background:#e2e8f0;color:var(--txt);}
.tab.active{background:var(--pri);color:#fff;box-shadow:0 4px 12px rgba(99,102,241,.25);}
.tab .x{opacity:.6;font-weight:700;padding:2px 6px;border-radius:6px;transition:.15s;}
.tab .x:hover{opacity:1;background:rgba(0,0,0,.15);}

.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.stat{flex:1;min-width:90px;text-align:center;background:#f8fafc;border-radius:14px;padding:14px 10px;border:1px solid var(--line);}
.stat b{display:block;font-size:1.6rem;font-weight:700;}
.stat span{font-size:.8rem;color:var(--mut);font-weight:500;}
.stat.ok{background:#ecfdf5;border-color:#a7f3d0;}.stat.ok b{color:var(--ok);}
.stat.ab{background:#fef2f2;border-color:#fecaca;}.stat.ab b{color:var(--absent);}
.stat.lv{background:#fffbeb;border-color:#fde68a;}.stat.lv b{color:var(--leave);}

ul{list-style:none;}
.person{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);transition:.15s;border-radius:10px;}
.person:hover{background:#f8fafc;}
.person:last-child{border-bottom:none;}
.person .name{flex:1;font-weight:500;font-size:1rem;}
.person .no{width:32px;height:32px;border-radius:10px;background:#e0e7ff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;}

.marks{display:flex;gap:8px;}
.mark{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem;cursor:pointer;transition:.2s;color:var(--mut);}
.mark:hover{border-color:var(--pri);transform:scale(1.05);}
.mark.a-ok.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 10px rgba(16,185,129,.3);}
.mark.a-ab.on{background:var(--absent);border-color:var(--absent);color:#fff;box-shadow:0 4px 10px rgba(239,68,68,.3);}
.mark.a-lv.on{background:var(--leave);border-color:var(--leave);color:#fff;box-shadow:0 4px 10px rgba(245,158,11,.3);}

.empty{text-align:center;color:var(--mut);padding:32px;font-size:.95rem;}
.del{color:var(--mut);cursor:pointer;font-size:1rem;padding:8px;border-radius:8px;transition:.2s;}
.del:hover{color:var(--absent);background:#fee2e2;}

footer{text-align:center;color:var(--mut);font-size:.85rem;padding:24px 0;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}

/* ===== Custom Modal (confirm) ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-box{background:#fff;border-radius:var(--radius);padding:26px 24px;max-width:380px;width:calc(100% - 40px);box-shadow:0 20px 50px -10px rgba(0,0,0,.3);transform:translateY(12px) scale(.97);transition:transform .2s;}
.modal-overlay.show .modal-box{transform:translateY(0) scale(1);}
.modal-box .m-icon{width:56px;height:56px;border-radius:50%;background:#fef3c7;color:var(--leave);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 14px;}
.modal-box.danger .m-icon{background:#fee2e2;color:var(--absent);}
.modal-box .m-msg{text-align:center;font-size:1.02rem;font-weight:500;color:#1e293b;margin-bottom:20px;line-height:1.5;}
.modal-box .m-actions{display:flex;gap:10px;}
.modal-box .m-actions button{flex:1;}

/* ===== Toast ===== */
#toastWrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;gap:10px;width:calc(100% - 40px);max-width:420px;pointer-events:none;}
.toast{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px -6px rgba(0,0,0,.18);display:flex;align-items:center;gap:12px;font-size:.92rem;font-weight:500;border-left:4px solid var(--pri);transform:translateY(-16px);opacity:0;transition:.25s;}
.toast.show{transform:translateY(0);opacity:1;}
.toast.ok{border-left-color:var(--ok);} .toast.ok i{color:var(--ok);}
.toast.err{border-left-color:var(--absent);} .toast.err i{color:var(--absent);}
.toast.warn{border-left-color:var(--leave);} .toast.warn i{color:var(--leave);}
.toast.info i{color:var(--pri);}
.toast i{font-size:1.15rem;flex-shrink:0;}
</style>
</head>
<body>
<header>
  <h1><i class="fa-solid fa-clipboard-user"></i> เว็บเช็กชื่อออนไลน์</h1>
  <p>จัดการรายชื่อ • สร้างหัวข้อห้อง • เช็กชื่อสะดวกรวดเร็ว</p>
</header>
<div class="wrap">
  <!-- หัวข้อ / Topics[cite: 1] -->
  <div class="card">
    <h2><i class="fa-solid fa-folder-open text-indigo-500"></i> หัวข้อ (ห้อง / คลาส / กิจกรรม)[cite: 1]</h2>
    <div id="tabs" class="tabs"></div>
    <div class="row">
      <input id="topicName" placeholder="เช่น ม.6/1 , ประชุมทีม ..." onkeydown="if(event.key==='Enter')addTopic()">
      <button onclick="addTopic()"><i class="fa-solid fa-plus"></i> เพิ่มหัวข้อใหม่</button>
    </div>
  </div>

  <!-- เนื้อหาหัวข้อ[cite: 1] -->
  <div id="content"></div>
</div>
<footer><i class="fa-solid fa-shield-halved"></i> ข้อมูลถูกบันทึกในเครื่องของคุณโดยอัตโนมัติ (LocalStorage)[cite: 1]</footer>

<!-- Custom modal + toast containers -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="m-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
    <div class="m-msg" id="modalMsg"></div>
    <div class="m-actions">
      <button class="ghost" id="modalCancel"><i class="fa-solid fa-xmark"></i> ยกเลิก</button>
      <button id="modalOk"><i class="fa-solid fa-check"></i> ตกลง</button>
    </div>
  </div>
</div>
<div id="toastWrap"></div>

<!-- Firebase SDK (ใช้แชร์ข้อมูลข้ามเครื่อง เพื่อนเห็นข้อมูลชุดเดียวกัน) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ============================================================
   ⭐ ตั้งค่า Firebase ที่นี่
   นำค่า config จากโปรเจกต์ Firebase ของคุณมาวางแทนค่า PASTE_...
   ถ้ายังไม่ตั้งค่า เว็บจะทำงานแบบเก็บข้อมูลในเครื่องเท่านั้น (เพื่อนจะไม่เห็น)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBwKXYJji4qQNoOvhcqpdBWHdpPLQ4sXJ0",
  authDomain: "tarsaray1.firebaseapp.com",
  databaseURL: "https://tarsaray1-default-rtdb.firebaseio.com",
  projectId: "tarsaray1",
  storageBucket: "tarsaray1.firebasestorage.app",
  messagingSenderId: "782765725846",
  appId: "1:782765725846:web:d645224c9942a0075acab7",
  measurementId: "G-WF8T4DSX5D"
};
const DB_PATH = 'attendance/shared';   // เปลี่ยนได้ถ้าอยากแยกหลายกลุ่ม

let fbRef=null, fbReady=false, applyingRemote=false;
function firebaseConfigured(){
  return FIREBASE_CONFIG.databaseURL && FIREBASE_CONFIG.databaseURL.indexOf('PASTE_')===-1;
}
function initFirebase(){
  if(!firebaseConfigured()) return false;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbRef = firebase.database().ref(DB_PATH);
    fbRef.on('value', function(snap){
      const remote = snap.val();
      if(remote && remote.topics){
        applyingRemote = true;
        data = remote;
        if(!data.topics) data.topics=[];
        if(data.topics.length && !data.topics.find(t=>t.id===data.active)) data.active=data.topics[0].id;
        localStorage.setItem(KEY, JSON.stringify(data));
        render();
        applyingRemote = false;
      }
      if(!fbReady){
        fbReady = true;
        if((!remote || !remote.topics) && data.topics.length){ fbRef.set(data); }
        toast('เชื่อมต่อฐานข้อมูลออนไลน์แล้ว — เพื่อน ๆ จะเห็นข้อมูลชุดเดียวกัน','ok');
      }
    }, function(err){ toast('เชื่อมต่อฐานข้อมูลไม่สำเร็จ: '+err.message,'err'); });
    return true;
  }catch(e){ toast('ตั้งค่า Firebase ไม่สำเร็จ: '+e.message,'err'); return false; }
}

const KEY='checkname_data_v1';
let data={topics:[],active:null};

/* ===== Custom confirm modal (Promise-based) ===== */
function confirmModal(msg,opts){
  opts=opts||{};
  return new Promise(resolve=>{
    const ov=document.getElementById('modalOverlay');
    const box=document.getElementById('modalBox');
    document.getElementById('modalMsg').textContent=msg;
    box.classList.toggle('danger',!!opts.danger);
    box.querySelector('.m-icon i').className=opts.danger?'fa-solid fa-trash-can':'fa-solid fa-triangle-exclamation';
    const okBtn=document.getElementById('modalOk');
    okBtn.className=opts.danger?'danger':'';
    okBtn.innerHTML=(opts.danger?'<i class="fa-solid fa-trash-can"></i> ':'<i class="fa-solid fa-check"></i> ')+(opts.okText||'ตกลง');
    ov.classList.add('show');
    function close(val){ov.classList.remove('show');okBtn.onclick=null;document.getElementById('modalCancel').onclick=null;ov.onclick=null;resolve(val);}
    okBtn.onclick=()=>close(true);
    document.getElementById('modalCancel').onclick=()=>close(false);
    ov.onclick=e=>{if(e.target===ov)close(false);};
  });
}

/* ===== Toast ===== */
function toast(msg,type){
  type=type||'info';
  const icons={ok:'fa-circle-check',err:'fa-circle-xmark',warn:'fa-triangle-exclamation',info:'fa-circle-info'};
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML='<i class="fa-solid '+(icons[type]||icons.info)+'"></i><span></span>';
  el.querySelector('span').textContent=msg;
  wrap.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),300);},3200);
}

function load(){
  try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s);}catch(e){}
  if(!data.topics)data.topics=[];
  if(data.topics.length&&!data.topics.find(t=>t.id===data.active))data.active=data.topics[0].id;
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
  if(fbRef && !applyingRemote){ fbRef.set(data); }
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function addTopic(){
  const el=document.getElementById('topicName');
  const name=el.value.trim();
  if(!name){el.focus();return;}
  const t={id:uid(),name,people:[]};
  data.topics.push(t);
  data.active=t.id;
  el.value='';
  save();render();
}
async function delTopic(id,ev){
  ev.stopPropagation();
  const t=data.topics.find(x=>x.id===id);
  if(!await confirmModal('ต้องการลบหัวข้อ “'+t.name+'” ใช่หรือไม่?',{danger:true,okText:'ลบ'}))return;
  data.topics=data.topics.filter(x=>x.id!==id);
  if(data.active===id)data.active=data.topics[0]?data.topics[0].id:null;
  save();render();
  toast('ลบหัวข้อเรียบร้อยแล้ว','ok');
}
function setActive(id){data.active=id;save();render();}

function addPerson(){
  const t=cur();if(!t)return;
  const el=document.getElementById('personName');
  const name=el.value.trim();
  if(!name){el.focus();return;}
  t.people.push({id:uid(),name,status:''});
  el.value='';el.focus();
  save();render();
}
function delPerson(pid){
  const t=cur();if(!t)return;
  t.people=t.people.filter(p=>p.id!==pid);
  save();render();
}
function mark(pid,st){
  const t=cur();if(!t)return;
  const p=t.people.find(x=>x.id===pid);
  p.status=(p.status===st)?'':st;
  save();render();
}
async function clearMarks(){
  const t=cur();if(!t)return;
  if(!await confirmModal('ล้างสถานะการเช็กทั้งหมดในหัวข้อนี้?',{danger:true,okText:'ล้าง'}))return;
  t.people.forEach(p=>p.status='');
  save();render();
  toast('ล้างสถานะการเช็กเรียบร้อยแล้ว','ok');
}
function cur(){return data.topics.find(t=>t.id===data.active);}

function render(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML=data.topics.map(t=>
    `<div class="tab ${t.id===data.active?'active':''}" onclick="setActive('${t.id}')">`+
    `<span><i class="fa-solid fa-bookmark" style="font-size:0.8rem;opacity:0.8"></i> ${esc(t.name)}</span>`+
    `<span class="x" onclick="delTopic('${t.id}',event)"><i class="fa-solid fa-xmark"></i></span></div>`
  ).join('')||'<span class="empty" style="padding:4px;color:var(--mut);">ยังไม่มีหัวข้อ — สร้างหัวข้อใหม่ด้านล่างได้เลย</span>';

  const c=document.getElementById('content');
  const t=cur();
  if(!t){c.innerHTML='';return;}
  const ok=t.people.filter(p=>p.status==='ok').length;
  const ab=t.people.filter(p=>p.status==='ab').length;
  const lv=t.people.filter(p=>p.status==='lv').length;

  c.innerHTML=`
  <div class="card">
    <h2><i class="fa-solid fa-user-plus text-indigo-500"></i> เพิ่มรายชื่อ — ${esc(t.name)}</h2>
    <div class="row">
      <input id="personName" placeholder="พิมพ์ชื่อ-นามสกุล แล้วกด Enter" onkeydown="if(event.key==='Enter')addPerson()">
      <button onclick="addPerson()"><i class="fa-solid fa-plus"></i> เพิ่มรายชื่อ</button>
    </div>
  </div>
  <div class="card">
    <div class="stats">
      <div class="stat"><b>${t.people.length}</b><span>ทั้งหมด</span></div>
      <div class="stat ok"><b>${ok}</b><span>มาเรียน</span></div>
      <div class="stat ab"><b>${ab}</b><span>ขาดเรียน</span></div>
      <div class="stat lv"><b>${lv}</b><span>ลา</span></div>
    </div>
    <div class="toolbar">
      <b style="font-size:1rem;color:#334155"><i class="fa-solid fa-users"></i> รายชื่อสมาชิก (${t.people.length})</b>
      <div class="row" style="flex:0">
        <button class="ghost sm" onclick="clearMarks()"><i class="fa-solid fa-rotate-right"></i> รีเซ็ตสถานะ</button>
        <button class="sm" style="background:#5865F2" onclick="sendDiscord()"><i class="fa-brands fa-discord"></i> ส่งเข้า Discord</button>
      </div>
    </div>
    <ul id="list"></ul>
  </div>
  <div class="card">
    <h2><i class="fa-brands fa-discord text-indigo-500"></i> ตั้งค่า Discord Webhook</h2>
    <p style="font-size:.85rem;color:var(--mut);margin-bottom:10px">แต่ละหัวข้อสามารถตั้ง Webhook แยกกันเพื่อส่งเข้าคนละห้อง Discord ได้[cite: 1]</p>
    <div class="row">
      <input id="webhook" placeholder="วาง Discord Webhook URL ที่นี่" value="${esc(t.webhook||'')}">
      <button class="ghost" onclick="saveWebhook()"><i class="fa-solid fa-floppy-disk"></i> บันทึก</button>
    </div>
    <p style="font-size:.8rem;color:var(--mut);margin-top:8px">ℹ️ วิธีหา Webhook: Discord Channel Settings → Integrations → Webhooks → New Webhook → Copy URL[cite: 1]</p>
  </div>`;

  const list=document.getElementById('list');
  if(!t.people.length){list.innerHTML='<li class="empty"><i class="fa-regular fa-folder-open" style="font-size:2rem;margin-bottom:8px;display:block"></i>ยังไม่มีรายชื่อ — เพิ่มชื่อสมาชิกด้านบนได้เลย</li>';return;}
  list.innerHTML=t.people.map((p,i)=>`
    <li class="person">
      <span class="no">${i+1}</span>
      <span class="name">${esc(p.name)}</span>
      <div class="marks">
        <div class="mark a-ok ${p.status==='ok'?'on':''}" title="มาเรียน" onclick="mark('${p.id}','ok')"><i class="fa-solid fa-check"></i></div>
        <div class="mark a-ab ${p.status==='ab'?'on':''}" title="ขาดเรียน" onclick="mark('${p.id}','ab')"><i class="fa-solid fa-xmark"></i></div>
        <div class="mark a-lv ${p.status==='lv'?'on':''}" title="ลา" onclick="mark('${p.id}','lv')"><i class="fa-solid fa-solid fa-clock"></i></div>
      </div>
      <span class="del" title="ลบรายชื่อ" onclick="delPerson('${p.id}')"><i class="fa-solid fa-trash-can"></i></span>
    </li>`).join('');
}

function saveWebhook(){
  const t=cur();if(!t)return;
  t.webhook=document.getElementById('webhook').value.trim();
  save();
  toast(t.webhook?'บันทึก Discord Webhook เรียบร้อยแล้ว':'ล้าง Webhook เรียบร้อยแล้ว','ok');
}

function buildReport(t){
  const m={ok:'✅ มา',ab:'❌ ขาด',lv:'🟡 ลา','':'➖ ยังไม่เช็ก'};
  const ok=t.people.filter(p=>p.status==='ok').length;
  const ab=t.people.filter(p=>p.status==='ab').length;
  const lv=t.people.filter(p=>p.status==='lv').length;
  let s='📋 **รายงานการเช็กชื่อ: '+t.name+'**\n';
  s+='🕒 '+new Date().toLocaleString('th-TH')+'\n';
  s+='👥 ทั้งหมด '+t.people.length+' • ✅ มา '+ok+' • ❌ ขาด '+ab+' • 🟡 ลา '+lv+'\n';
  s+='──────────────────\n';
  t.people.forEach((p,i)=>{s+='`'+String(i+1).padStart(2,' ')+'.` '+p.name+' — '+m[p.status]+'\n';});
  return s;
}

async function sendDiscord(){
  const t=cur();if(!t)return;
  const url=(t.webhook||'').trim();
  if(!url){toast('หัวข้อนี้ยังไม่ได้ตั้งค่า Discord Webhook URL — กรุณาใส่ที่ช่องตั้งค่าด้านล่างก่อน','warn');return;}
  if(!/discord(app)?\.com\/api\/webhooks\//.test(url)){toast('URL นี้ไม่ใช่ Discord Webhook URL ที่ถูกต้อง','warn');return;}
  if(!t.people.length){toast('ยังไม่มีรายชื่อในหัวข้อนี้','warn');return;}
  const report=buildReport(t);
  const chunks=splitMsg(report,1900);
  try{
    for(const c of chunks){
      const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})});
      if(!res.ok)throw new Error('HTTP '+res.status);
    }
    toast('ส่งรายงานเข้า Discord เรียบร้อยแล้ว!','ok');
  }catch(e){
    toast('ส่งไม่สำเร็จ: '+e.message,'err');
  }
}

function splitMsg(s,max){
  const lines=s.split('\n');const out=[];let buf='';
  for(const ln of lines){
    if((buf+ln+'\n').length>max){out.push(buf);buf='';}
    buf+=ln+'\n';
  }
  if(buf.trim())out.push(buf);
  return out.length?out:[s];
}
